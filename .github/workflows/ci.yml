name: U181 Triton CI Image Smoke

on:
  push:
    branches:
      - ci/u181-runner-smoke
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: u181-runner-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.repository == 'douyixuan/FlagTree'
    runs-on: [self-hosted, u181, flagtree, container]
    timeout-minutes: 15

    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@v6

      - name: Verify runner and checkout provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_NAME" = "u181-flagtree-1"
          test "$RUNNER_OS" = "Linux"
          grep -q '^VERSION_ID="22.04"' /etc/os-release
          git --version
          df -h "$RUNNER_WORKSPACE"

      - name: Verify the pinned Triton CI development image
        shell: bash
        run: |
          set -euo pipefail
          test "$TRITON_CI_IMAGE" = \
            "192.168.22.215/ubuntu22.04-triton-py313-dev:20260804@sha256:ec763b57ebd103780b60d989713ac9e180425d383c1cf55cf63914d8d5d6235d"
          test "$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "3.13"
          python3 --version
          cmake --version | head -n 1
          ninja --version
          gcc --version | head -n 1

      - name: Verify GitHub egress through the runner proxy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --head --max-time 15 \
            https://api.github.com/ >/dev/null

      - name: Compile FlagTree Python sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q python/triton
